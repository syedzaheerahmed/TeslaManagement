services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesla-management-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/tesla_management_v2
      - DB_USERNAME=postgres
    secrets:
      - db-password
      - jwt-secret
    networks:
      - tesla-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  tesla-network:
    driver: bridge

volumes:
  db-data:
    driver: local

secrets:
  db-password:
    file: ./secrets/db_password.txt
  jwt-secret:
    file: ./secrets/jwt_secret.txt