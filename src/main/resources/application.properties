spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tesla_management_v2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=update
spring.jpa.properties.jakarta.persistence.schema-generation.create-source=metadata
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=update
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=update.sql

jwt.token.validity=600000
jwt.signing.key=${JWT_SIGNING_KEY:teslamangementkey}
jwt.authorities.key=roles
jwt.token.prefix=Bearer
jwt.header.string=Authorization
jwt.secret=357638792F423F4428472B4B6250655368566D597133743677397A2443264629

management.endpoints.web.exposure.include=health