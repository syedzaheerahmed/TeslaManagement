# ===================================================================
#                      PRODUCTION CONFIGURATION
# ===================================================================

# ----- Database Configuration -----
# Use the Cloud SQL Socket Factory for secure, automatic connections.
# This is the recommended approach for connecting from services within GCP.
spring.cloud.gcp.sql.instance-connection-name=${DB_INSTANCE_CONNECTION_NAME}
spring.cloud.gcp.sql.database-name=${DB_NAME}

# The username for the dedicated app user we created in Step 1.
spring.datasource.username=${DB_USERNAME}

# Pull the password directly from GCP Secret Manager at startup.
# The 'sm://' prefix tells Spring Cloud GCP where to look.
spring.datasource.password=${sm://DB_PASSWORD}

# ----- JPA / Hibernate Configuration -----
# IMPORTANT: 'update' is risky for production as it can lead to accidental data loss.
# 'validate' is safer. It checks if your database schema matches your JPA entities on startup and fails if it doesn't.
# For true production-grade deployments, you should use a migration tool like Flyway or Liquibase.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ----- Production JWT Configuration -----
# Pull the JWT secret directly from GCP Secret Manager.
jwt.secret=${sm://JWT_SECRET}
jwt.access-token.expiry=900000
refresh-token.expiry=2592000000

# ----- Production Logging -----
# Avoid DEBUG logging in production to reduce noise and improve performance.
logging.level.root=INFO
logging.level.com.example.TeslaManagement=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN